<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIOZXR | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Shared variables and core styles */
        :root {
            --bg-primary: #0a0e17; --bg-secondary: #121826; --text-main: #f0f4f8; --text-muted: #9ba7b6;
            --accent-primary: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08);
            --font-head: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-primary); color: var(--text-main); font-family: var(--font-body); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%); background-attachment: fixed; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

        nav { position: fixed; top: 0; left: 0; right: 0; padding: 1rem 0; z-index: 100; background: rgba(10, 14, 23, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border); }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; text-decoration: none; color: var(--text-main); letter-spacing: -0.5px; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-primary); }

        .mobile-toggle { display: none; background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; }
        @media (max-width: 768px) {
            .mobile-toggle { display: block; }
            .nav-links { position: fixed; top: 60px; left: 0; right: 0; background: var(--bg-secondary); flex-direction: column; gap: 1.5rem; padding: 2rem; border-bottom: 1px solid var(--glass-border); transform: translateY(-150%); transition: transform 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
            .nav-links.open { transform: translateY(0); }
        }
        footer { border-top: 1px solid var(--glass-border); padding: 3rem 0; text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 4rem; }

        .fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        /* Contact Specific */
        .contact-section {
            padding: 8rem 0 4rem 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: flex-start;
        }

        @media (max-width: 900px) {
            .contact-section { grid-template-columns: 1fr; gap: 3rem; }
        }

        .contact-info h1 {
            font-family: var(--font-head);
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .contact-info p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 3rem;
            max-width: 500px;
        }

        .social-cards {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .social-card {
            display: flex;
            align-items: center;
            padding: 1.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
        }

        .social-card:hover {
            transform: translateX(10px);
            border-color: rgba(59, 130, 246, 0.4);
            background: rgba(255,255,255,0.05);
        }

        .social-card-icon {
            font-size: 1.5rem;
            margin-right: 1.5rem;
        }

        .social-card-text {
            font-family: var(--font-head);
            font-weight: 500;
            font-size: 1.1rem;
        }

        /* Form styling optimized for desktop and mobile */
        .contact-form {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 16px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        /* Ensure touch targets are large enough on mobile */
        @media (max-width: 768px) {
            .form-control, .btn-submit, .social-card { padding: 1.25rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">FIOZXR</a>
            <button class="mobile-toggle" id="mobile-toggle">☰</button>
            <div class="nav-links" id="nav-links">
                <a href="projects.html">Projects</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="contact-section">

            <div class="contact-info fade-up">
                <h1>Initiate Protocol</h1>
                <p>Available for freelance engagements, system auditing, and open-source collaborations. Use the secure form or direct channels below.</p>
                
                <div class="social-cards">
                    <a href="mailto:fiozxrrahman@duck.com" class="social-card">
                        <span class="social-card-icon">✉️</span>
                        <span class="social-card-text">fiozxrrahman@duck.com</span>
                    </a>
                    <a href="https://github.com/fiozxr" class="social-card">
                        <span class="social-card-icon">🐙</span>
                        <span class="social-card-text">GitHub Profile</span>
                    </a>
                    <a href="https://x.com/fiozxr" class="social-card">
                        <span class="social-card-icon">🐦</span>
                        <span class="social-card-text">Twitter / X</span>
                    </a>
                </div>
            </div>

            <div class="contact-form-container fade-up" style="transition-delay: 0.2s;">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name" class="form-label">Identifier (Name)</label>
                        <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Transmission Node (Email)</label>
                        <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message" class="form-label">Data Payload (Message)</label>
                        <textarea id="message" class="form-control" placeholder="How can I assist you?" required></textarea>
                    </div>

                    <button type="button" class="btn-submit">Transmit Message</button>
                </form>
            </div>

        </section>

        <footer>
            <p>&copy; 2026 FIOZXR. Professional Security Portfolio.</p>
        </footer>
    </div>

    <script>
        const toggle = document.getElementById('mobile-toggle');
        const nav = document.getElementById('nav-links');
        toggle.addEventListener('click', () => { nav.classList.toggle('open'); toggle.textContent = nav.classList.contains('open') ? '✕' : '☰'; });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
            });
        }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    </script>
</body>
</html>
