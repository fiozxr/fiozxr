<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIOZXR | Contact</title>
    <style>
        /* [SAME SHARED CSS AS ABOVE] */
        :root { --bg-color: #050505; --text-main: #ffffff; --text-muted: #888888; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --accent-glow: rgba(255, 255, 255, 0.15); --font-main: 'Inter', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-main); overflow-x: hidden; line-height: 1.6; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2); border-radius: 20px; border: 2px solid var(--bg-color); background-clip: content-box; }
        .aurora-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: radial-gradient(circle at 50% 50%, rgba(30, 30, 30, 0.4), transparent 60%); opacity: 0.6; animation: breathe 10s infinite alternate; }
        @keyframes breathe { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(1.2); opacity: 0.7; } }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 2rem 0; margin-bottom: 5rem; backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, #fff, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        footer { border-top: 1px solid var(--glass-border); padding: 3rem 0; text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 5rem; }
        .fade-in-up { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .fade-in-up.visible { opacity: 1; transform: translateY(0); }

        /* --- CONTACT SPECIFIC CSS --- */
        .contact-layout { display: grid; grid-template-columns: 1fr; gap: 4rem; }
        @media(min-width: 768px) { .contact-layout { grid-template-columns: 1fr 1fr; } }

        .contact-info h1 { font-size: 3rem; margin-bottom: 1.5rem; }
        .contact-info p { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.1rem; }
        
        .social-list { display: flex; flex-direction: column; gap: 1rem; }
        .social-item { display: flex; align-items: center; gap: 1rem; text-decoration: none; color: var(--text-main); font-size: 1.1rem; padding: 1rem; border: 1px solid var(--glass-border); border-radius: 12px; background: var(--glass-bg); transition: 0.3s; }
        .social-item:hover { background: rgba(255,255,255,0.05); border-color: var(--text-muted); transform: translateX(10px); }

        .contact-form { background: var(--glass-bg); padding: 2rem; border-radius: 24px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        .form-input, .form-textarea { width: 100%; padding: 1rem; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); font-family: var(--font-main); outline: none; transition: 0.3s; }
        .form-input:focus, .form-textarea:focus { border-color: var(--text-muted); background: rgba(0,0,0,0.5); }
        .form-textarea { min-height: 150px; resize: vertical; }
        .submit-btn { width: 100%; padding: 1rem; background: var(--text-main); color: var(--bg-color); border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { opacity: 0.9; transform: scale(1.02); }

    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="aurora-bg"></div>

    <div class="container">
        <nav>
            <a href="index.html" class="logo">ＦＩＯＺ XR</a>
            <div class="nav-links">
                <a href="projects.html">Projects</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </nav>

        <div class="contact-layout">
            <div class="contact-info fade-in-up">
                <h1>Let's Connect</h1>
                <p>Have a project in mind or just want to discuss security? I'm available for freelance work and open-source collaborations.</p>
                
                <div class="social-list">
                    <a href="mailto:fiozxrrahman@duck.com" class="social-item">
                        <span>✉️</span> Email Me
                    </a>
                    <a href="https://github.com/fiozxr" class="social-item">
                        <span>🐙</span> GitHub
                    </a>
                    <a href="https://instagram.com/fiozxr_" class="social-item">
                        <span>📸</span> Instagram
                    </a>
                </div>
            </div>

            <div class="contact-form fade-in-up" style="transition-delay: 0.2s;">
                <form>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" class="form-input" placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-input" placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea class="form-textarea" placeholder="Tell me about your project..."></textarea>
                    </div>
                    <button type="button" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 FIOZXR. NO RIGHTS RESERVED .</p>
        </footer>
    </div>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in-up').forEach((el) => observer.observe(el));
    </script>
</body>
</html>
